version: 2
updates:
- package-ecosystem: nix
  directory: /
  schedule:
    interval: weekly
  # The homelab inputs in one PR, with the ones they follow from here: each
  # homelab main is checked against the locks it has, so one moved alone can
  # meet an older one it doesn't evaluate against
  groups:
    homelab:
      patterns: ["homelab-*", "setup-secrets", "k8sss", "kube-generators", "docs"]
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: docker
  # The Dockerfiles only pin upstream images for lib.images.pinned, which
  # reads their hashes from the images.lock next to them
  directories:
  - /nix/modules/*
  schedule:
    interval: weekly
