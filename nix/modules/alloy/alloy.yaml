---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: alloy
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
---
# What alloy-config.alloy reads: its discovery.kubernetes components, the ServiceMonitors with the Services, endpoints
# and pods they select, and the kubelet's metrics (nodes/metrics: its /metrics and /metrics/*, not the rest of the
# kubelet API that nodes/proxy opens, exec included). A monitor whose endpoint takes a credential from a Secret or
# ConfigMap needs get on those as well
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: alloy
  name: alloy
rules:
- apiGroups: [""]
  resources: [endpoints, namespaces, nodes, pods, services]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: [monitoring.coreos.com]
  resources: [servicemonitors]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes/metrics]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: alloy
